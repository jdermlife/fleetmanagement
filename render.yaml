services:
  - type: web
    name: fleetmanagement-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python migrate_fastapi_security.py && python migrate_users_enterprise_fields.py && python migrate_store_billing.py && python migrate_overall_scores_wealth_fields.py && gunicorn main:app -k uvicorn.workers.UvicornWorker --workers 3 --threads 2 --timeout 120 --graceful-timeout 30 --keep-alive 5 --max-requests 1000 --max-requests-jitter 100 --bind 0.0.0.0:10000
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
      - key: PAYMONGO_SUCCESS_URL
        value: https://fleetmanagement-flame.vercel.app/subscription-payment?checkout=success
      - key: PAYMONGO_CANCEL_URL
        value: https://fleetmanagement-flame.vercel.app/subscription-payment?checkout=cancelled
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ACCOUNT_PAID_VALIDITY_DAYS
        value: "31"
