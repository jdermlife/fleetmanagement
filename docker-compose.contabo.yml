services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.txt
    env_file:
      - ./backend/.env.contabo
    environment:
      ENVIRONMENT: production
      AUTO_RUN_SCHEMA_MIGRATIONS: "false"
      REDIS_URL: redis://redis:6379/0
    command:
      - /bin/sh
      - -c
      - >-
        python migrate_fastapi_security.py &&
        python migrate_users_enterprise_fields.py &&
        python migrate_store_billing.py &&
        python migrate_overall_scores_composite_fields.py &&
        python migrate_overall_scores_wealth_fields.py &&
        exec gunicorn main:app -k uvicorn.workers.UvicornWorker
        --workers 3 --threads 2 --timeout 120 --graceful-timeout 30
        --keep-alive 5 --max-requests 1000 --max-requests-jitter 100
        --bind 0.0.0.0:5000
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data: