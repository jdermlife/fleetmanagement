apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = [:]
def hasReleaseKeystore = false

if (keystorePropertiesFile.exists()) {
    def keystorePropertyPrefix = 'releaseSigning'
    ant.property(file: keystorePropertiesFile, prefix: keystorePropertyPrefix)
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
        keystoreProperties[key] = ant.properties["${keystorePropertyPrefix}.${key}"]
    }
    hasReleaseKeystore = [
        'storeFile',
        'storePassword',
        'keyAlias',
        'keyPassword',
    ].every { key ->
        keystoreProperties[key] != null && !keystoreProperties[key].trim().isEmpty()
    }
}

def isReleaseBuildRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName?.toLowerCase()?.contains('release')
}

def admobAppId = (project.findProperty('ADMOB_APP_ID') ?: System.getenv('ADMOB_APP_ID'))?.toString()?.trim()
def googleTestAdmobAppId = 'ca-app-pub-3940256099942544~3347511713'

if (isReleaseBuildRequested && !hasReleaseKeystore) {
    throw new GradleException("Release builds require a configured keystore.properties file. Refusing to fall back to a debug signing key.")
}

if (isReleaseBuildRequested && !admobAppId) {
    throw new GradleException("Release builds require ADMOB_APP_ID as a Gradle property or environment variable.")
}

android {
    namespace = "com.quantech.filscore"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.quantech.filscore"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 32
        versionName "1.0.31"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [ADMOB_APP_ID: admobAppId ?: googleTestAdmobAppId]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.work:work-runtime:$androidxWorkVersion"
    implementation "com.google.android.gms:play-services-wearable:20.0.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
