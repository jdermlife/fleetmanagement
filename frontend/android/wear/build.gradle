apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = [:]
def hasReleaseKeystore = false

if (keystorePropertiesFile.exists()) {
    def keystorePropertyPrefix = 'releaseSigning'
    ant.property(file: keystorePropertiesFile, prefix: keystorePropertyPrefix)
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
        keystoreProperties[key] = ant.properties["${keystorePropertyPrefix}.${key}"]
    }
    hasReleaseKeystore = [
        'storeFile',
        'storePassword',
        'keyAlias',
        'keyPassword',
    ].every { key ->
        keystoreProperties[key] != null && !keystoreProperties[key].trim().isEmpty()
    }
}

def isReleaseBuildRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName?.toLowerCase()?.contains('release')
}

if (isReleaseBuildRequested && !hasReleaseKeystore) {
    throw new GradleException("Wear OS release builds require a configured keystore.properties file. Refusing to fall back to a debug signing key.")
}

android {
    namespace = "com.quantech.filscore.wear"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.quantech.filscore"
        minSdkVersion 30
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 360010001
        versionName "1.0.0-wear"
    }

    buildFeatures {
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                def releaseStoreFile = new File(keystoreProperties['storeFile'])
                if (!releaseStoreFile.isAbsolute()) {
                    releaseStoreFile = rootProject.file("app/${keystoreProperties['storeFile']}")
                }
                storeFile releaseStoreFile
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2026.09.00")

    implementation composeBom
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.10.0"
    implementation "androidx.wear.compose:compose-material3:1.7.1"
    implementation "androidx.wear.compose:compose-foundation:1.7.1"
    implementation "androidx.wear.compose:compose-navigation:1.7.1"
    implementation "com.google.android.gms:play-services-wearable:20.0.1"

    debugImplementation "androidx.compose.ui:ui-tooling"
    testImplementation "junit:junit:$junitVersion"
}