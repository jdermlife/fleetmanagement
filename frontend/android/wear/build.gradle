apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "com.quantech.filscore.wear"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.quantech.filscore"
        minSdkVersion 30
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 360010001
        versionName "1.0.0-wear"
    }

    buildFeatures {
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2026.09.00")

    implementation composeBom
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.10.0"
    implementation "androidx.wear.compose:compose-material3:1.7.1"
    implementation "androidx.wear.compose:compose-foundation:1.7.1"
    implementation "androidx.wear.compose:compose-navigation:1.7.1"
    implementation "com.google.android.gms:play-services-wearable:20.0.1"

    debugImplementation "androidx.compose.ui:ui-tooling"
    testImplementation "junit:junit:$junitVersion"
}